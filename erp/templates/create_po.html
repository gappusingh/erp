{% extends "base.html" %}

{% block title %}Create Purchase Order{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h1 class="h3">Create New Purchase Order (PO)</h1>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('main.create_purchase_order') }}">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="supplier" class="form-label">Supplier</label>
                        <select name="supplier" id="supplier" class="form-select" required>
                            <option value="" selected disabled>-- Select a Supplier --</option>
                            {% for supplier in suppliers %}
                                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr>
                <h4 class="mb-3">Add Item</h4>

                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label for="product" class="form-label">Product</label>
                        <select name="product" id="product" class="form-select" required>
                            <option value="" selected disabled>-- Select a Product --</option>
                            {% for product in products %}
                                <option value="{{ product.id }}">{{ product.name }} (Stock: {{ product.stock }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" name="quantity" id="quantity" class="form-control" min="1" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="unit_cost" class="form-label">Unit Cost (Purchase Price)</label>
                        <input type="number" name="unit_cost" id="unit_cost" class="form-control" step="0.01" min="0" required>
                    </div>
                </div>

                <hr>

                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save me-2"></i>Create Purchase Order
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
